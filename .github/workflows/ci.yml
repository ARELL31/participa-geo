name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python lint and fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked Python dependencies
        run: uv sync --frozen --all-groups --no-install-project

      - name: Ruff
        run: uv run ruff check .

      - name: Unit tests (national and retained compatibility)
        run: |
          uv run pytest -q tests/unit
          uv run pytest -q tests/contract/test_health.py
          uv run pytest -q tests/contract/test_read_api.py -k "district_models_are_unavailable or federal_district_predictions_fail_with_stable_409 or openapi_matches_contract"
          uv run pytest -q tests/contract/test_scenario_api.py -k "district_scenario_returns_unavailable_conflict or district_recommendations_are_unavailable_without_municipal_fallback or recommendations_reject_invalid_level or recommendations_reject_mixed_level_values or openapi_declares_scenario_contract"

  frontend:
    name: TypeScript lint, typecheck, Vitest and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Use pinned Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test -- --run

      - name: Production build
        run: npm run build

      # Playwright acceptance requires the national compose stack and licensed
      # local source artifacts; it is run during the documented clean-room
      # acceptance, not represented as a GitHub Actions result.
