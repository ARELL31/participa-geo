[project]
name = "participa-geo"
version = "0.1.0"
description = "PARTICIPA-GEO MVP: análisis municipal de participación electoral (Jalisco 2009-2027)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API / web
    "fastapi>=0.110",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Data / analysis
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    # GIS
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    # Reporting / exports
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "pillow>=10.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The project is not installed as a distribution; the container exposes the
# source via PYTHONPATH (see infrastructure/docker/api.Dockerfile).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["participa_geo", "gis", "pipelines"]
known-third-party = ["alembic"]
