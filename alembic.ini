# Alembic configuration for PARTICIPA-GEO.
#
# The database URL is NOT stored here (no secrets in committed files). The
# ``db migrate`` CLI builds the migrator-role URL from Settings and injects it,
# and ``alembic/env.py`` falls back to the MIGRATOR environment variables. The
# placeholder below is replaced before any connection is attempted.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
