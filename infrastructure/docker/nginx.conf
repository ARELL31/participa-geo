# PARTICIPA-GEO web reverse proxy.
#
# The browser only ever talks to this origin (127.0.0.1:8080). `/api/` is
# proxied to the FastAPI gateway, which is the only allowed path to GeoServer.
# There is no direct GeoServer route and no CORS relaxation.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # GeoServer administration is internal-only. Never let a browser path fall
    # through to the SPA or expose the REST admin surface through nginx.
    location = /geoserver {
        return 404;
    }
    location /geoserver/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # WMS GetMap responses are images; do not buffer them into a slow start.
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        # `expires` sets the cache headers without overriding the security
        # headers inherited from the server block.
        expires 1y;
    }

    location /licenses/ {
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
